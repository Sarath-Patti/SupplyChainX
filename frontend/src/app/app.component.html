<!-- Loading Overlay During Async Session Initialization -->
<div class="auth-loading-overlay" *ngIf="!authService.isInitialized()">
  <div class="spinner"></div>
  <p>Authenticating Session...</p>
</div>

<!-- Full Screen Layout for Auth Pages -->
<div *ngIf="authService.isInitialized() && !authService.isLoggedIn()">
  <router-outlet></router-outlet>
</div>

<!-- Authenticated Dashboard Layout -->
<div class="app-layout" *ngIf="authService.isInitialized() && authService.isLoggedIn()">
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-icon">⚡</div>
      <div class="brand-text">
        <h2>SupplyChainX</h2>
        <span class="version-badge">v1.3.0</span>
      </div>
    </div>

    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a routerLink="/copilot" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🤖</span>
        <span class="nav-label">AI Copilot</span>
      </a>
      <a routerLink="/products" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📦</span>
        <span class="nav-label">Products</span>
      </a>
      <a routerLink="/warehouses" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🏭</span>
        <span class="nav-label">Warehouses</span>
      </a>
      <a routerLink="/inventory" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Inventory</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="system-status-widget">
        <div class="status-indicator" [class.healthy]="systemHealth?.status === 'Healthy'" [class.unhealthy]="systemHealth?.status !== 'Healthy'"></div>
        <div class="status-info">
          <span class="status-title">System Status</span>
          <span class="status-value" *ngIf="systemHealth">{{ systemHealth.status }}</span>
          <span class="status-value offline" *ngIf="!systemHealth">Offline</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Top Header -->
    <header class="top-header">
      <div class="header-left">
        <span class="page-context">Clean Architecture & Event-Driven Engine</span>
      </div>
      <div class="header-right">
        <div class="live-clock">
          <span class="clock-icon">🕒</span>
          <span>{{ currentTime | date:'mediumTime' }} UTC</span>
        </div>

        <!-- User Identity & Role Badge -->
        <div class="user-profile" *ngIf="authService.getUser() as user">
          <div class="user-avatar">👤</div>
          <div class="user-details">
            <span class="user-name">{{ user.username }}</span>
            <div class="user-roles">
              <span *ngFor="let role of user.roles" class="role-badge" [class.admin]="role === 'Admin'" [class.operator]="role === 'Operator'" [class.viewer]="role === 'Viewer'">
                {{ role }}
              </span>
            </div>
          </div>
        </div>

        <button class="logout-btn" (click)="logout()" title="Sign Out">
          <span>🚪</span> Logout
        </button>
      </div>
    </header>

    <!-- Dynamic Router Page Outlet -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
