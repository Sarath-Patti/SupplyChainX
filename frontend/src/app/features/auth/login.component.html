<div class="auth-container">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="logo-icon">📦</span>
      <h1 class="brand-title">SupplyChainX</h1>
      <p class="auth-subtitle">Sign in to access your enterprise portal</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">
      <span>⚠️</span> {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="credentials.username"
          name="username"
          required
          placeholder="e.g. admin or operator@supplychainx.com"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="credentials.password"
          name="password"
          required
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In ➔</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register New User</a></p>
    </div>
  </div>
</div>
